{% extends "admission/base.html" %}
{% block content %}

<style>
    .login-wrapper {
        min-height: 75vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-card {
        width: 100%;
        max-width: 420px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        transition: 0.3s ease;
    }

    .login-card:hover {
        transform: translateY(-5px);
    }

    .form-control {
        border-radius: 10px;
        padding: 10px;
    }

    .btn-primary {
        border-radius: 10px;
        padding: 10px;
        font-weight: 500;
    }

    .login-title {
        font-weight: 600;
    }
</style>

<div class="login-wrapper">
    <div class="login-card p-4">

        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-primary" style="font-size: 2.5rem;"></i>
            <h3 class="login-title mt-2">Portal Login</h3>
            <small class="text-muted">
                Access your admission dashboard
            </small>
        </div>

        <!-- LOGIN FORM -->
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" 
                       name="username" 
                       class="form-control" 
                       placeholder="Enter your username" 
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" 
                       name="password" 
                       class="form-control" 
                       placeholder="Enter your password" 
                       required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </button>
        </form>

        <div class="text-center mt-3">
            <small>
                New student?
                <a href="{% url 'admission:register' %}" class="text-decoration-none">
                    Register here
                </a>
            </small>
        </div>

    </div>
</div>

{% endblock %}
