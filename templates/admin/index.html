{% extends "admin/index.html" %}
{% load static %}

{% block content %}

<div style="display:flex;gap:20px;margin-bottom:30px;flex-wrap:wrap;">

    <div style="flex:1;background:#0d6efd;color:white;padding:20px;border-radius:10px;">
        <h3>Total Applications</h3>
        <h1>{{ total_students }}</h1>
    </div>

    <div style="flex:1;background:#28a745;color:white;padding:20px;border-radius:10px;">
        <h3>Approved</h3>
        <h1>{{ approved }}</h1>
    </div>

    <div style="flex:1;background:#ffc107;color:black;padding:20px;border-radius:10px;">
        <h3>Pending</h3>
        <h1>{{ pending }}</h1>
    </div>

    <div style="flex:1;background:#dc3545;color:white;padding:20px;border-radius:10px;">
        <h3>Rejected</h3>
        <h1>{{ rejected }}</h1>
    </div>

    <div style="flex:1;background:#6610f2;color:white;padding:20px;border-radius:10px;">
        <h3>Total Courses</h3>
        <h1>{{ courses }}</h1>
    </div>

</div>

{{ block.super }}

{% endblock %}
